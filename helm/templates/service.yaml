apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  type: {{ .Values.service.type }}
  ports: [{port: {{ .Values.service.port }}, targetPort: 8000, name: http}]
  selector:
    app.kubernetes.io/name: ozon-collector
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mcp
spec:
  type: ClusterIP
  ports: [{port: 8090, targetPort: 8090, name: mcp}]
  selector:
    app.kubernetes.io/name: ozon-collector
    app.kubernetes.io/component: mcp
