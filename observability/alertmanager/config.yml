global:
  resolve_timeout: 5m
route:
  group_by: [alertname, severity]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 2h
  receiver: local-only
receivers:
  - name: local-only
    # IMPORTANT: no external notification recipient configured.
    # Production must set an email/webhook receiver and verify P0/P1 delivery.
